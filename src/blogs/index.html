---
layout: page-base.njk
title: my blog.
description: weekly blog posts documenting andrew huang's robotics and engineering projects.
cssFile: blog-listing.css
jsFile: null
mainClass: container grid
---
    <section class="search-section">
        <div class="search-container">
            <label for="blog-search" class="sr-only">search posts</label>
            <input type="text" id="blog-search" placeholder="search smth..." class="search-input">
            <button class="clear-btn" type="button">
                <span class="clear-txt">clear</span>
                {% include "icons/clear.njk" %}
            </button>
        </div>

        <div class="search-filters">
            <div class="filter-right">
                <div class="clear-btn" id="sort">
                    {% include "icons/sort.njk" %}
                    <span class="clear-txt">sort: </span>
                </div>
                <select class="sort-select" aria-label="sort posts">
                    <option value="newest">newest</option>
                    <option value="oldest">oldest</option>
                </select>
            </div>
        </div>
    </section>

    <section id="posts-container" class="posts-list"></section>

<script defer src="/js/posts.js"></script>
<script defer src="/js/blog.js"></script>
