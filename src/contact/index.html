    <style>
:root {
    --bg: hsl(0, 0%, 5%);
    --card-bg: hsl(0, 0%, 10%);
    --bg-dark: hsl(0, 0%, 0%);
    --border: hsl(217, 33%, 17%);
    --text-main: hsl(0, 0%, 95%);
    --text-dim: hsl(0, 0%, 70%);
    --accent: hsl(199, 95%, 61%);
    --nav-gap: 2rem;
}

[data-theme="light"] {
    --bg: hsl(0, 0%, 100%);
    --card-bg: hsl(210, 40%, 98%);
    --border: hsl(214, 32%, 91%);
    --text-main: hsl(222, 47%, 11%);
    --text-dim: hsl(215, 16%, 47%);
    --accent: hsl(199, 89%, 48%);
    --bg-dark: hsl(0, 0%, 100%);
}

body {
    background-color: var(--bg);
    color: var(--text-main);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    margin: 0;
    transition: background 0.3s ease, color 0.3s ease;
}

.page-title {
    font-size: 3.5rem;
    font-weight: 800;
    margin-bottom: 2.5rem;
}

.contact-form {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
}

input, textarea {
    background-color: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text-main);
    padding: 1rem;
    border-radius: 8px;
    font-family: inherit;
    font-size: 1rem;
    transition: border-color 0.2s;
}

input:focus, textarea:focus {
    outline: none;
    border-color: var(--text-dim);
}

.submit-btn {
    background-color: var(--text-main);
    color: var(--bg);
    border: none;
    padding: 1rem;
    border-radius: 8px;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: opacity 0.2s;
}

.submit-btn:hover {
    opacity: 0.9;
}

.form-disclaimer {
    color: var(--text-dim);
    font-size: 0.85rem;
    margin-top: 1rem;
}

.form-disclaimer a {
    color: var(--text-dim);
    text-decoration: underline;
}

.contact-footer {
    margin-top: 6rem;
    padding-top: 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: none; 
    color: var(--text-dim);
    font-size: 0.9rem;
}

.footer-socials {
    display: flex;
    gap: 1.5rem;
}

.footer-socials a {
    color: var(--text-dim);
    transition: color 0.2s;
}

.footer-socials a:hover {
    color: var(--text-main);
}

.theme-toggle-btn {
    background: none;
    border: none;
    cursor: pointer;
    padding: 5px;
    display: flex;
    align-items: center; 
    justify-content: center;
    color: var(--text-main);
    font-size: 1.2rem;
    transition: transform 0.2s ease;
}

.theme-toggle-btn .moon-icon {
    display: none;
}

.theme-toggle-btn .sun-icon {
    display: block;
}

[data-theme="light"] .theme-toggle-btn .sun-icon {
    display: none;
}

[data-theme="light"] .theme-toggle-btn .moon-icon {
    display: block;
    color: var(--text-main);
}

.theme-toggle-btn:hover {
    transform: scale(1.1);
}

@media (max-width: 600px) {
    .form-row {
        grid-template-columns: 1fr;
    }
    .contact-footer {
        flex-direction: column;
        gap: 1.5rem;
        text-align: center;
    }
}

@media (max-width: 400px) {
    .main-nav { gap: 1rem; }
}
